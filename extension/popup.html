<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ReplyPilot</title><link rel="stylesheet" href="popup.css"></head>
<body><header><span class="badge">RP</span><div><h1>ReplyPilot</h1><p>Your words. A little easier.</p></div></header>
<main><button id="read" class="secondary">Read conversation</button><section id="preview" hidden><h2 id="contact"></h2><p id="latest"></p><details><summary>Review recent conversation to be sent</summary><pre id="context"></pre></details></section>
<div class="controls"><label>Tone<select id="tone"><option>Friendly</option><option>Professional</option><option>Casual</option></select></label><label>Length<select id="length"><option>Short</option><option>Medium</option></select></label></div>
<details class="settings"><summary>My style</summary><label><input type="checkbox" id="short"> Keep replies short</label><label><input type="checkbox" id="natural"> Use natural English</label><label><input type="checkbox" id="avoidAI"> Avoid robotic wording</label><label><input type="checkbox" id="noEmoji"> No emojis</label><label>Additional preferences<textarea id="instructions" maxlength="1000" placeholder="e.g. Express interest in research collaborations"></textarea></label></details>
<p class="notice">Generate sends the previewed conversation through your local server to the AI provider. Review each reply before sending it yourself.</p><button id="generate" disabled>Generate replies</button><p id="status" role="status" aria-live="polite"></p><section id="replies" aria-label="Suggested replies"></section></main><script src="popup.js"></script></body></html>
